name: Fork Build

# Builds and publishes an image for every patch/** branch and for combined
# (the branch that merges all patches together and is what's actually
# deployed). Image tag is derived from the branch name so new patch
# branches need zero workflow edits to get their own container. See
# jellyfin-fork-brief.md for the full branch layout.

on:
  push:
    branches:
      - 'patch/**'
      - combined
  workflow_dispatch:

concurrency:
  group: fork-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image tag from branch name
        id: vars
        run: |
          SAFE_NAME=$(echo "${{ github.ref_name }}" | tr '/' '-')
          echo "tag=$SAFE_NAME" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/fork/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/jellyfin:${{ steps.vars.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/jellyfin:${{ steps.vars.outputs.tag }}-${{ github.sha }}
